name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # GitHub Pages alt dizini + demo sürümü (backend yok, menü statik veriden)
      - run: npm run build
        env:
          BASE_PATH: /cucus-cafe-web-side/
          VITE_DEMO_MODE: "true"
      # Eski statik şifre sayfaları backend'e bağlı; demoda React sayfaları (demo notuyla) açılsın
      - run: rm -f dist/forgot-password.html dist/reset-password.html
      # Alt sayfa linki doğrudan açılınca ya da yenilenince GitHub 404 vermesin: uygulama kendisi yönlendirsin
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
